<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Secure demo checkout · MerchantHub</title><link rel="stylesheet" href="/style.css"></head>
<body class="checkout-body">
  <div class="checkout-card">
    <div class="auth-brand"><div class="brand-mark">M</div><span>MerchantHub</span></div>
    <div class="eyebrow">DEMO CHECKOUT</div><h1>Complete your payment</h1><p class="muted">This is a simulated checkout. No card details or real money are involved.</p>
    <div id="checkoutDetails" class="checkout-details">Loading payment…</div>
    <div id="checkoutActions" class="checkout-actions hidden"><button class="btn primary full" id="paySuccess">Simulate successful payment</button><button class="btn secondary full" id="payFail">Simulate failed payment</button></div>
    <div id="checkoutMessage"></div>
  </div><script src="/checkout.js"></script>
</body></html>
